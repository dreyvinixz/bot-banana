version: '3.8'

services:
  bot-banana:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bot-banana
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
